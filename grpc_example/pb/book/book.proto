// demo/proto/book/book.proto

syntax = "proto3";

// 声明protobuf中的包名
package book;

// 声明生成的Go代码的导入路径
option go_package = "github.com/testProject/pb/book";

// 引入同目录下的protobuf文件（注意起始位置为proto_path的下层）
import "book/price.proto";
// 引入author
import "author/author.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/field_mask.proto";
import "google/api/annotations.proto";

message Book {
    string title = 1;
    Price price = 2;
    author.Info authorInfo = 3;
    reserved 4, 5;
    google.protobuf.StringValue idx = 6;
}

message BookCreateResponse {
    string result = 1;
}

message BookUpdateMsg {
    Book book = 1;
    google.protobuf.FieldMask update_mask = 2;
}

message BookUpdateResponse {
    string result = 1;
}

message HotBooksRequest {
    string request = 1;
}

message HotBooksResponse {
    string bookName = 1;
}

// 实现一个 Book 相关的方法
service BookService {
    // 创建一个 Book
    rpc Create(Book)returns(BookCreateResponse){
        option (google.api.http) = {
            post: "/v1/example/books"
            body: "*"
        };
    };
    // 更新 Book 的信息
    rpc Update(BookUpdateMsg)returns(BookUpdateResponse){};
    // 获取常见热门书籍
    rpc GetHotBooks(stream HotBooksRequest) returns (stream HotBooksResponse);
}

